name: Secure CI/CD Production Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  sast_scan:
    name: 1. Vulnerability Assessment (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube Scan Engine
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Enforce Custom Quality Gate Status
        uses: SonarSource/sonarqube-quality-gate-action@v2
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sca_scan:
    name: 2. Open-Source Dependency Scan (SCA)
    runs-on: ubuntu-latest
    needs: sast_scan  # Blocks SCA until SAST clears successfully
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Snyk - Scan Backend Dependencies
        uses: snyk/actions/node@master
        continue-on-error: false  # Hard-fails the pipeline if high CVEs are found
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/package.json

      - name: Snyk - Scan Frontend Dependencies
        uses: snyk/actions/node@master
        continue-on-error: false  # Hard-fails the pipeline if high CVEs are found
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=frontend/package.json

  deploy_production:
    name: 3. Production Environment Deployment
    runs-on: ubuntu-latest
    needs: sca_scan  # CRITICAL: Blocks deployment unless BOTH SAST and SCA pass!
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Simulate Cloud App Deployment
        run: |
          echo "All Security Gates (SAST & SCA) Cleared Successfully!"
          echo "Deploying production artifacts securely to the cloud host target..."
